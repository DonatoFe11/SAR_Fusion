experiment:
  name: DINO_Complete_Base_Final_Evaluation
  group: DINO_Investigation
  continue_with_errors: False
  search: grid

parameters:
  seed: &seed [42]
  task: [detection]

  tracker:
    ignored_files: ["*.bin,*.safetensors"]
    val_image_log_frequency: [50]
    tags: [[FinalReport]]

  model:
    name: [fusion_dino_defdetr]
    params:
      id2label:
        0: [person]
      threshold: [0.01, 0.1]
      pretrained_path:
        - "checkpoints/dino_defdetr1.safetensors"
        - "checkpoints/dino_defdetr2.safetensors"
        - "checkpoints/dino_defdetr3.safetensors"
        - "checkpoints/dino_defdetr4.safetensors"
        - "checkpoints/dino_defdetr5.safetensors"
      num_feature_levels: [4]
      use_fam: [false]
      freeze_fam: [false]
      ir_dropout_rate: [0.0]
      spatial_jitter_std: [0.0]
      num_dn_groups: [5]
      label_noise_prob: [0.5]
      box_noise_scale: [1.0]
      cdn_loss_coef: [1.0]
  
  dataset:
    name: [wisard]
    root: [dataset/WiSARD]
    preprocessor:
      path: ["SenseTime/deformable-detr"]
    folders: [vis, ir, vis_ir]
    single_class: [true]
    use_tiling: [false]

  dataloader:
    num_workers: [4]
    batch_size: [2]

  val_evaluation:
    metrics:

other_grids: []
