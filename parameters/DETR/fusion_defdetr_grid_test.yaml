experiment:
  name: DeformableDetr_FAM_Eager_SpatialJitter_Evaluation_Grid
  group: RTDETR_Investigation
  continue_with_errors: False
  search: grid

parameters:
  seed: &seed [42]
  task: [detection]

  tracker:
    ignored_files: ["*.bin,*.safetensors"]
    val_image_log_frequency: [50]
    tags: [[FinalReport]]

  model:
    name: [fusion_defdetr_fam]
    params:
      id2label:
        0: [person]
      threshold: [0.01, 0.05, 0.1]
      use_fam: [true]
      freeze_fam: [false]
      ir_dropout_rate: [0.0]
      spatial_jitter_std: [0.0]
      pretrained_path: ["checkpoints/model.safetensors"]
      num_feature_levels: [4]
  
  dataset:
    name: [wisard]
    root: [dataset/WiSARD]
    preprocessor:
      path: ["SenseTime/deformable-detr"]
    folders: [vis, ir, vis_ir]
    single_class: [true]
    use_tiling: [false]

  dataloader:
    num_workers: [4]
    batch_size: [1]

  val_evaluation:
    metrics:

other_grids: []
