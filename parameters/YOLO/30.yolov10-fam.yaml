# YOLOv10 + FAM — Grid Search Experiment
# Tests dual backbone + FAM(additive fusion) with SSJ regularization.
# Baseline (use_fam=False) = dual backbone without alignment.
#
# Dataset: RGB+IR synced pairs (vis_all_ir_sync), test on VIS
experiment:
  continue_with_errors: False

parameters:
  task: [detect]
  mode: [train]

  # Model settings
  model:
    name: [yolov10_fusion_fam]
    params:
      cfg: [cfg/yolov10-fusion-fam-s.yaml]
      use_fam: [True, False]
      spatial_jitter_std: [0.0, 0.5, 1.0]
      ir_dropout_rate: [0.0]
      freeze_fam: [False]

  data: [wisards_vis_ir.yaml]
  epochs: [200]
  patience: [30]
  batch: [16]
  imgsz: [640]
  save: [True]
  save_period: [10]
  val_period: [1]
  cache: [False]
  workers: [4]
  project: [SarYOLO]
  name: [YOLOv10-FAM-Grid]
  exist_ok: [False]
  pretrained: [False]  # Weights loaded internally by the model class
  optimizer: [AdamW]
  verbose: [True]
  seed: [42]
  deterministic: [True]
  augment_vis_ir: [False]  # Disabled: single-modality padding not yet implemented in WiSARDYOLODataset for 4ch models
  single_cls: [True]
  rect: [False]
  cos_lr: [False]
  close_mosaic: [10]
  resume: [False]
  amp: [True]
  fraction: [1.0]
  profile: [False]
  freeze: [None]
  multi_scale: [False]

  # Val/Test
  val: [True]
  split: [val]
  save_json: [False]
  save_hybrid: [False]
  iou: [0.7]
  max_det: [300]
  half: [False]
  dnn: [False]
  plots: [True]

  # Hyperparameters
  lr0: [0.0001]
  lrf: [0.00001]
  momentum: [0.937]
  weight_decay: [0.0005]
  warmup_epochs: [3.0]
  warmup_momentum: [0.8]
  warmup_bias_lr: [0.1]
  box: [7.5]
  cls: [0.5]
  dfl: [1.5]
  label_smoothing: [0.0]
  nbs: [64]
  hsv_h: [0.0]
  hsv_s: [0.0]
  hsv_v: [0.0]
  degrees: [0.0]
  translate: [0.1]
  scale: [0.5]
  shear: [0.0]
  perspective: [0.0]
  flipud: [0.0]
  fliplr: [0.5]
  bgr: [0.0]
  mosaic: [0.0]  # Disabled — RGB+IR pairs can't be mosaiced
  mixup: [0.0]
  copy_paste: [0.0]
  auto_augment: [randaugment]
  erasing: [0.4]
  crop_fraction: [1.0]

other_grids: []
