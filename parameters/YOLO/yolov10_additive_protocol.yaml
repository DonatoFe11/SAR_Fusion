# Final confirmatory YOLOv10 dual-backbone baseline.
# Five paired seeds, fixed 200-epoch horizon, feature-gated Modal Dropout,
# no early stopping, and test of the predeclared last.pt checkpoint.

experiment:
  name: YOLOv10_Additive_Protocol
  group: YOLOv10_Protocol
  continue_with_errors: false
  start_from_grid: 0
  start_from_run: 0
  search: grid
  isolate_runs: true

parameters:
  task: [detect]
  mode: [train]

  model:
    name: [yolov10_fusion_fam]
    params:
      cfg: [cfg/yolov10-fusion-fam-s.yaml]
      use_fam: [false]
      spatial_jitter_std: [0.0]
      ir_dropout_rate: [0.0]
      freeze_fam: [false]
      pretrained: [true]

  data: [wisards_vis_ir.yaml]
  epochs: [200]
  patience: [0]
  batch: [16]
  imgsz: [640]
  save: [true]
  save_period: [-1]
  val_period: [1]
  cache: [false]
  workers: [4]
  project: [SarYOLOAdditiveProtocol]
  name: [YOLOv10-Additive]
  exist_ok: [false]
  pretrained: [false]
  optimizer: [AdamW]
  verbose: [true]
  seed: [40, 41, 42, 43, 44]
  deterministic: [true]

  augment_vis_ir: [false]
  modal_dropout: [true]
  modal_dropout_strategy: [feature]
  modal_dropout_probs: [[0.2, 0.2, 0.6]]

  single_cls: [true]
  rect: [false]
  cos_lr: [false]
  close_mosaic: [10]
  resume: [false]
  amp: [true]
  fraction: [1.0]
  profile: [false]
  freeze: [None]
  multi_scale: [false]

  # Validation can still run once at the final epoch as an Ultralytics
  # diagnostic, but it neither stops training nor selects the tested model.
  val: [false]
  test_checkpoint: [last]
  split: [val]
  save_json: [false]
  save_hybrid: [false]
  iou: [0.7]
  max_det: [300]
  half: [false]
  dnn: [false]
  plots: [false]

  lr0: [0.0001]
  lrf: [0.00001]
  momentum: [0.937]
  weight_decay: [0.0005]
  warmup_epochs: [3.0]
  warmup_momentum: [0.8]
  warmup_bias_lr: [0.1]
  box: [7.5]
  cls: [0.5]
  dfl: [1.5]
  label_smoothing: [0.0]
  nbs: [64]
  hsv_h: [0.0]
  hsv_s: [0.0]
  hsv_v: [0.0]
  degrees: [0.0]
  translate: [0.1]
  scale: [0.5]
  shear: [0.0]
  perspective: [0.0]
  flipud: [0.0]
  fliplr: [0.5]
  bgr: [0.0]
  mosaic: [0.0]
  mixup: [0.0]
  copy_paste: [0.0]
  auto_augment: [randaugment]
  erasing: [0.4]
  crop_fraction: [1.0]

other_grids: []
