experiment:
  name: DeformableDETR_Fusion_FAM_SSJ_vis_ir
  group: DeformableDETR_Investigation
  continue_with_errors: False
  start_from_grid: 0
  start_from_run: 0
  search: grid

parameters:
  seed: &seed [49]
  task: [detection]

  tracker:
    ignored_files: ["*.bin,*.safetensors"]
    val_image_log_frequency: [50]

  train:
    max_epochs: [10]
    compile: [False]
    initial_lr: [0.00002]
    optimizer: [AdamW]
    watch_metric: [map]
    gradient_accumulation_steps: [4]
    time_probe_interval: [100]
    time_probe_sync: [True]

  loss:

  model:
    name: [fusion_defdetr_fam]
    params:
      id2label:
        0: [person]
      threshold: [0.01]
      num_feature_levels: [4]
      use_fam: [true]
      freeze_fam: [false]
      ir_dropout_rate: [0.0]
      spatial_jitter_std: [0.5]

  dataset:
    name: [wisard]
    root: [dataset/WiSARD]
    preprocessor:
      path: ["SenseTime/deformable-detr"]
    folders: [vis_ir]
    single_class: [true]
    modal_dropout: [true]
    modal_dropout_probs: [[0.2, 0.2, 0.6]]
    use_tiling: [false]

  dataloader:
    num_workers: [4]
    batch_size: [1]

  val_evaluation:
    metrics:

other_grids:
