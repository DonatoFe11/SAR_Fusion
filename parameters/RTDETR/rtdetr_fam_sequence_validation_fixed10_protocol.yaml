# Definitive RT-DETR + FAM baseline protocol after retiring the same-video
# temporal-tail pilot. Training always runs for exactly 10 epochs: validation
# selects `best`, but never stops or shortens a run. `latest` is also retained.
#
# Group split (whole paired videos):
# - train: FHL 0405/0406 + Baker 1 (3,123 paired frames);
# - validation: FHL 0401/0402 (896 paired frames);
# - test: the usual three paired MtErie streams (708 frames), disabled here.
#
# The complete validation video is absent from optimization. This avoids the
# 31-frame same-clip boundary and Baker-dominated validation of the retired v1
# pilot. The split was chosen from acquisition/annotation structure, not by
# trying several alternatives on MtErie.

experiment:
  name: RTDETR_FAM_SequenceVal_Fixed10_Protocol
  group: RTDETR_sequence_validation_fixed10_v1
  continue_with_errors: true
  start_from_grid: 0
  start_from_run: 0
  search: grid
  isolate_runs: true

parameters:
  seed: [40, 41, 42, 43, 44]
  repetition: [0]
  task: [detection]
  run_test: [false]
  test_checkpoint: [best]

  reproducibility:
    deterministic: [false]
    warn_only: [false]
    trace: [true]
    trace_batches: [20]
    trace_tensor_batches: [5]
    trace_model_steps: [3]

  tracker:
    ignored_files: ["*.bin,*.safetensors"]
    val_image_log_frequency: [50]
    tags: [[RTDETR, FAM, SequenceValidation, Fixed10, BestCheckpoint, Baseline]]

  train:
    max_epochs: [10]
    run_validation: [true]
    compute_validation_loss: [false]
    val_frequency: [1]
    save_checkpoints: [true]
    # Save best on every qualifying improvement and latest at epoch 10 only.
    save_final_checkpoint_only: [true]
    checkpoint_min_delta: [0.001]
    compile: [false]
    initial_lr: [0.00002]
    optimizer: [AdamW]
    watch_metric: [map_50]
    greater_is_better: [true]

  loss:

  model:
    name: [fusion_rtdetr]
    params:
      id2label:
        0: [person]
      threshold: [0.01]
      use_fam: [true]
      fam_variant: [current_dcnv2]
      freeze_fam: [false]
      ir_dropout_rate: [0.0]
      spatial_jitter_std: [0.0]
      reuse_pretrained_class_head: [true]

  dataset:
    name: [wisard]
    root: [dataset/WiSARD]
    preprocessor:
      path: ["PekingU/rtdetr_r50vd"]
    folders: [vis_ir]
    train_folders:
      - - [210924_FHL_Enterprise_VIS_0405, 210924_FHL_Enterprise_IR_0406]
        - [220109_Baker_Enterprise_VIS_1, 220109_Baker_Enterprise_IR_1]
    val_folders:
      - - [210924_FHL_Enterprise_VIS_0401, 210924_FHL_Enterprise_IR_0402]
    single_class: [true]
    modal_dropout: [true]
    modal_dropout_probs: [[0.2, 0.2, 0.6]]
    use_tiling: [false]

  dataloader:
    num_workers: [8]
    batch_size: [4]
    evaluation_batch_size: [12]

  val_evaluation:
    metrics:

other_grids: []
