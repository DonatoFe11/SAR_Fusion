# New post-pilot five-seed campaign (2026-09-09), documented in
# notes/rtdetr_v2_fam_five_seed_v2.md. All five seeds are fresh runs.
# Stage A primary: best validation mAP@50 within ten complete epochs.
# Epoch-10 latest and per-epoch curves are diagnostic. Full-data Stage B,
# if promoted, uses fresh training and epoch-10 latest (see the note).
# Five singleton grids couple seed/data/model/training RNGs without a
# Cartesian product. Grid indices 0..4 correspond to seeds 40..44.

experiment:
  name: RTDETRv2_FAM_SequenceVal_FiveSeed_V2
  group: RTDETRv2_additive_fam_sequence_validation_five_seed_v2
  continue_with_errors: false
  start_from_grid: 0
  start_from_run: 0
  search: grid
  isolate_runs: true

parameters:
  seed: &seed40 [40]
  repetition: [0]
  task: [detection]
  run_test: [false]
  test_checkpoint: [best]
  strict_checkpoint_loading: [true]

  reproducibility:
    deterministic: [false]
    warn_only: [false]
    trace: [true]
    training_source_manifest_id: [rtdetr_v2_fam_training_source_v1]
    training_source_manifest_sha256: [712f61f53cabc9c18a8f56146fb9075f466e7a9da1b37e667e6df5e2bfe81b0f]
    data_seed: *seed40
    model_seed: *seed40
    training_seed: *seed40
    trace_batches: [20]
    trace_tensor_batches: [5]
    trace_model_steps: [3]

  tracker:
    ignored_files: ["*.bin,*.safetensors"]
    val_image_log_frequency: [50]
    tags: [[RTDETRv2, FAM, CurrentDCNv2, SequenceValidation, FiveSeedV2, Fixed10, BestPrimary, StageA, PostPilot]]

  train:
    max_epochs: [10]
    run_validation: [true]
    compute_validation_loss: [false]
    val_frequency: [1]
    save_checkpoints: [true]
    # Saves best at each qualifying improvement and latest at epoch 10.
    save_final_checkpoint_only: [true]
    checkpoint_min_delta: [0.001]
    compile: [false]
    initial_lr: [0.00002]
    optimizer: [AdamW]
    watch_metric: [map_50]
    greater_is_better: [true]

  loss:

  model:
    name: [fusion_rtdetr_v2]
    params:
      id2label:
        0: [person]
      threshold: [0.01]
      use_fam: [true]
      fam_variant: [current_dcnv2]
      fam_initialization: [historical_hf_post_init]
      freeze_fam: [false]
      ir_dropout_rate: [0.0]
      spatial_jitter_std: [0.0]
      reuse_pretrained_class_head: [true]
      pretrained_model_name: [PekingU/rtdetr_v2_r50vd]
      pretrained_revision: ["282494075698cab9faa1096ae26856890030c817"]

  dataset:
    name: [wisard]
    root: [dataset/WiSARD]
    preprocessor:
      path: [PekingU/rtdetr_v2_r50vd]
      revision: ["282494075698cab9faa1096ae26856890030c817"]
      use_fast: [false]
    folders: [vis_ir]
    train_folders:
      - - [210924_FHL_Enterprise_VIS_0405, 210924_FHL_Enterprise_IR_0406]
        - [220109_Baker_Enterprise_VIS_1, 220109_Baker_Enterprise_IR_1]
    val_folders:
      - - [210924_FHL_Enterprise_VIS_0401, 210924_FHL_Enterprise_IR_0402]
    single_class: [true]
    modal_dropout: [true]
    modal_dropout_coordinate_contract: [native]
    modal_dropout_probs: [[0.2, 0.2, 0.6]]
    use_tiling: [false]

  dataloader:
    num_workers: [8]
    batch_size: [4]
    evaluation_batch_size: [12]

  val_evaluation:
    metrics:

other_grids:
  - seed: &seed41 [41]
    reproducibility:
      data_seed: *seed41
      model_seed: *seed41
      training_seed: *seed41
  - seed: &seed42 [42]
    reproducibility:
      data_seed: *seed42
      model_seed: *seed42
      training_seed: *seed42
  - seed: &seed43 [43]
    reproducibility:
      data_seed: *seed43
      model_seed: *seed43
      training_seed: *seed43
  - seed: &seed44 [44]
    reproducibility:
      data_seed: *seed44
      model_seed: *seed44
      training_seed: *seed44
