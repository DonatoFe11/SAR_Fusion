experiment:
  name: RTDETR_FAM_Grid_Sample_Modality_Evaluation
  group: RTDETR_FAM_Grid_Sample
  continue_with_errors: false
  start_from_grid: 0
  start_from_run: 0
  search: grid
  isolate_runs: true

# Five final checkpoints x three test modalities (VIS, IR and VIS+IR).
parameters:
  seed: [42]
  repetition: [0]
  task: [detection]
  run_test: [true]
  test_checkpoint: [current]

  tracker:
    ignored_files: ["*.bin,*.safetensors"]
    val_image_log_frequency: [50]
    tags: [[RTDETR, Evaluation, Modalities, Ablation, Grid-Sample]]

  model:
    name: [fusion_rtdetr]
    params:
      id2label:
        0: [person]
      threshold: [0.01]
      use_fam: [true]
      fam_variant: [grid_sample]
      freeze_fam: [false]
      ir_dropout_rate: [0.0]
      spatial_jitter_std: [0.0]
      reuse_pretrained_class_head: [true]
      require_full_pretrained_match: [true]
      pretrained_wandb:
        project: [RTDETR_FAM_Grid_Sample_Ablation]
        seed: [40]
        checkpoint: [latest]

  dataset:
    name: [wisard]
    root: [dataset/WiSARD]
    preprocessor:
      path: ["PekingU/rtdetr_r50vd"]
    folders: [vis, ir, vis_ir]
    single_class: [true]
    modal_dropout: [false]
    use_tiling: [false]

  dataloader:
    num_workers: [8]
    batch_size: [12]

  val_evaluation:
    metrics:

other_grids:
  - model:
      params:
        pretrained_wandb:
          seed: [41]
  - model:
      params:
        pretrained_wandb:
          seed: [42]
  - model:
      params:
        pretrained_wandb:
          seed: [43]
  - model:
      params:
        pretrained_wandb:
          seed: [44]
