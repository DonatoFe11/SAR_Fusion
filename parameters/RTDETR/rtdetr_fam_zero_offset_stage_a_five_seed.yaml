# Offset-only initialization ablation: use scripts/run_rtdetr_fam_zero_offset_stage_a.py.
# Five seeds, 10 epochs each. Reuse the frozen standard-FAM Stage-A controls.
# Only predictor rows 0:18 are zeroed AFTER pretrained initialization.
# Mask rows 18:27 and DCNv2 filters retain the reference random initialization.

experiment:
  name: RTDETR_FAM_ZeroOffset_StageA_FiveSeed
  group: RTDETR_FAM_zero_offset_stage_a_v1
  continue_with_errors: false
  start_from_grid: 0
  start_from_run: 0
  search: grid
  isolate_runs: true

parameters:
  seed: &seed40 [40]
  repetition: [0]
  task: [detection]
  run_test: [false]
  test_checkpoint: [best]
  strict_checkpoint_loading: [true]

  reproducibility:
    deterministic: [false]
    warn_only: [false]
    trace: [true]
    training_source_manifest_id: [rtdetr_fam_zero_offset_training_source_v1]
    training_source_manifest_sha256: [373c796c59fc43e018a22a3b8b2e2506abfaad3539296b21a799508f8db56d7e]
    data_seed: *seed40
    model_seed: *seed40
    training_seed: *seed40
    trace_batches: [20]
    trace_tensor_batches: [5]
    trace_model_steps: [3]

  tracker:
    ignored_files: ["*.bin,*.safetensors"]
    val_image_log_frequency: [50]
    tags: [[RTDETR, FAM, ZeroOffsetsOnly, StageA, FiveSeed, Fixed10, BestPrimary, NoSeedScreen]]

  train:
    max_epochs: [10]
    run_validation: [true]
    compute_validation_loss: [false]
    val_frequency: [1]
    save_checkpoints: [true]
    save_final_checkpoint_only: [true]
    checkpoint_min_delta: [0.001]
    compile: [false]
    initial_lr: [0.00002]
    optimizer: [AdamW]
    watch_metric: [map_50]
    greater_is_better: [true]

  loss:

  model:
    name: [fusion_rtdetr_zero_offset]
    params:
      id2label:
        0: [person]
      threshold: [0.01]
      use_fam: [true]
      fam_variant: [current_dcnv2]
      freeze_fam: [false]
      ir_dropout_rate: [0.0]
      spatial_jitter_std: [0.0]
      reuse_pretrained_class_head: [true]

  dataset:
    name: [wisard]
    root: [dataset/WiSARD]
    preprocessor:
      path: ["PekingU/rtdetr_r50vd"]
    folders: [vis_ir]
    train_folders:
      - - [210924_FHL_Enterprise_VIS_0405, 210924_FHL_Enterprise_IR_0406]
        - [220109_Baker_Enterprise_VIS_1, 220109_Baker_Enterprise_IR_1]
    val_folders:
      - - [210924_FHL_Enterprise_VIS_0401, 210924_FHL_Enterprise_IR_0402]
    single_class: [true]
    modal_dropout: [true]
    modal_dropout_coordinate_contract: [native]
    modal_dropout_probs: [[0.2, 0.2, 0.6]]
    use_tiling: [false]

  dataloader:
    num_workers: [8]
    batch_size: [4]
    evaluation_batch_size: [12]

  val_evaluation:
    metrics:

other_grids:
  - seed: &seed41 [41]
    reproducibility:
      data_seed: *seed41
      model_seed: *seed41
      training_seed: *seed41
  - seed: &seed42 [42]
    reproducibility:
      data_seed: *seed42
      model_seed: *seed42
      training_seed: *seed42
  - seed: &seed43 [43]
    reproducibility:
      data_seed: *seed43
      model_seed: *seed43
      training_seed: *seed43
  - seed: &seed44 [44]
    reproducibility:
      data_seed: *seed44
      model_seed: *seed44
      training_seed: *seed44
