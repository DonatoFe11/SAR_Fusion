# Frozen Stage-B RCRA candidate. Apart from RCRA itself and its predeclared
# dedicated LR, this file is configuration-matched to the Stage-B FAM baseline.
# All 4,019 paired frames are optimized for ten epochs; no validation, early
# stopping, automatic test or checkpoint selection is performed.

experiment:
  name: RTDETR_FAM_RCRA_FullData_StageB_FiveSeed
  group: RTDETR_FAM_RCRA_full_data_stage_b_v1
  continue_with_errors: false
  start_from_grid: 0
  start_from_run: 0
  search: grid
  isolate_runs: true

parameters:
  seed: [40, 41, 42, 43, 44]
  repetition: [0]
  task: [detection]
  run_test: [false]
  test_checkpoint: [latest]

  reproducibility:
    deterministic: [false]
    warn_only: [false]
    trace: [true]
    trace_batches: [20]
    trace_tensor_batches: [5]
    trace_model_steps: [3]

  tracker:
    ignored_files: ["*.bin,*.safetensors"]
    val_image_log_frequency: [50]
    tags: [[RTDETR, FAM, RCRA, ResidualAlignment, FullData, Fixed10, LatestCheckpoint, StageB]]

  train:
    max_epochs: [10]
    run_validation: [false]
    save_checkpoints: [true]
    save_final_checkpoint_only: [true]
    compile: [false]
    initial_lr: [0.00002]
    alignment_gate_lr: [0.0002]
    optimizer: [AdamW]
    watch_metric: [map]
    greater_is_better: [true]

  loss:

  model:
    name: [fusion_rtdetr]
    params:
      id2label:
        0: [person]
      threshold: [0.01]
      use_fam: [true]
      fam_variant: [current_dcnv2]
      use_p2: [false]
      use_reliability_gating: [false]
      use_residual_alignment_gating: [true]
      residual_alignment_hidden_channels: [16]
      use_scalar_residual_alignment: [false]
      freeze_fam: [false]
      ir_dropout_rate: [0.0]
      spatial_jitter_std: [0.0]
      reuse_pretrained_class_head: [true]

  dataset:
    name: [wisard]
    root: [dataset/WiSARD]
    preprocessor:
      path: ["PekingU/rtdetr_r50vd"]
    folders: [vis_ir]
    train_folders:
      - - [210924_FHL_Enterprise_VIS_0401, 210924_FHL_Enterprise_IR_0402]
        - [210924_FHL_Enterprise_VIS_0405, 210924_FHL_Enterprise_IR_0406]
        - [220109_Baker_Enterprise_VIS_1, 220109_Baker_Enterprise_IR_1]
    val_folders:
      - - [210924_FHL_Enterprise_VIS_0134, 210924_FHL_Enterprise_IR_0135]
    test_folders:
      - - [210417_MtErie_Enterprise_VIS_0003, 210417_MtErie_Enterprise_IR_0004]
        - [210417_MtErie_Enterprise_VIS_0005, 210417_MtErie_Enterprise_IR_0006]
        - [210417_MtErie_Enterprise_VIS_0007, 210417_MtErie_Enterprise_IR_0008]
    single_class: [true]
    modal_dropout: [true]
    modal_dropout_probs: [[0.2, 0.2, 0.6]]
    use_tiling: [false]

  dataloader:
    num_workers: [8]
    batch_size: [4]
    evaluation_batch_size: [12]

  val_evaluation:
    metrics:

other_grids: []
