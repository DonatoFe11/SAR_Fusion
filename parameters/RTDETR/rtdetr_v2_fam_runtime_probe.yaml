# Engineering-only paired probe.  Both metrics are excluded from the campaign;
# this checks that additive and FAM RT-DETRv2 paths train and validate in the
# new environment before either scientific seed-40 run is created.

experiment:
  name: RTDETRv2_FAM_RuntimeProbe_v3
  group: RTDETRv2_fam_runtime_probe_v3
  continue_with_errors: false
  start_from_grid: 0
  start_from_run: 0
  search: grid
  isolate_runs: true

parameters:
  seed: [40]
  repetition: [0]
  task: [detection]
  run_test: [false]
  test_checkpoint: [best]
  strict_checkpoint_loading: [true]

  reproducibility:
    deterministic: [false]
    warn_only: [false]
    trace: [true]
    data_seed: [40]
    model_seed: [40]
    training_seed: [40]
    trace_batches: [3]
    trace_tensor_batches: [2]
    trace_model_steps: [2]

  tracker:
    ignored_files: ["*.bin,*.safetensors"]
    val_image_log_frequency: [50]
    tags: [[RTDETRv2, FAM, RuntimeProbe, ExcludeFromCampaign]]

  train:
    max_epochs: [1]
    max_steps_per_epoch: [20]
    run_validation: [true]
    compute_validation_loss: [false]
    val_frequency: [1]
    save_checkpoints: [false]
    compile: [false]
    initial_lr: [0.00002]
    optimizer: [AdamW]
    watch_metric: [map_50]
    greater_is_better: [true]

  loss:

  model:
    name: [fusion_rtdetr_v2]
    params:
      id2label:
        0: [person]
      threshold: [0.01]
      use_fam: [false, true]
      fam_variant: [current_dcnv2]
      fam_initialization: [historical_hf_post_init]
      freeze_fam: [false]
      ir_dropout_rate: [0.0]
      spatial_jitter_std: [0.0]
      reuse_pretrained_class_head: [true]
      pretrained_model_name: [PekingU/rtdetr_v2_r50vd]
      pretrained_revision: ["282494075698cab9faa1096ae26856890030c817"]

  dataset:
    name: [wisard]
    root: [dataset/WiSARD]
    preprocessor:
      path: [PekingU/rtdetr_v2_r50vd]
      revision: ["282494075698cab9faa1096ae26856890030c817"]
    folders: [vis_ir]
    train_folders:
      - - [210924_FHL_Enterprise_VIS_0405, 210924_FHL_Enterprise_IR_0406]
        - [220109_Baker_Enterprise_VIS_1, 220109_Baker_Enterprise_IR_1]
    val_folders:
      - - [210924_FHL_Enterprise_VIS_0401, 210924_FHL_Enterprise_IR_0402]
    single_class: [true]
    modal_dropout: [true]
    modal_dropout_probs: [[0.2, 0.2, 0.6]]
    use_tiling: [false]

  dataloader:
    num_workers: [8]
    batch_size: [4]
    evaluation_batch_size: [12]

  val_evaluation:
    metrics:

other_grids: []
