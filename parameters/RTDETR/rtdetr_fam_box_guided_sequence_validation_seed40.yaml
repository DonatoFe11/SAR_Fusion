# Frozen seed-40 screen.  Expand to the five-seed file only if the detection
# and mechanism gates predeclared in notes/rtdetr_fam_box_guided_stage_a.md pass.

experiment:
  name: RTDETR_FAM_BoxGuided_SequenceVal_Seed40
  group: RTDETR_fam_box_guided_sequence_validation_v1
  continue_with_errors: false
  start_from_grid: 0
  start_from_run: 0
  search: grid
  isolate_runs: true

parameters:
  seed: [40]
  repetition: [0]
  task: [detection]
  run_test: [false]
  test_checkpoint: [best]

  reproducibility:
    deterministic: [false]
    warn_only: [false]
    trace: [true]
    training_source_manifest_id: [rtdetr_box_guided_training_source_v1]
    training_source_manifest_sha256: [b06ea1328be206a9f7c64b3412f64ed7bb95b884da591c476584a90403592412]
    trace_batches: [20]
    trace_tensor_batches: [5]
    trace_model_steps: [3]

  tracker:
    ignored_files: ["*.bin,*.safetensors"]
    val_image_log_frequency: [50]
    tags: [[RTDETR, FAM, BoxGuided, P3, SequenceValidation, Seed40, StageA]]

  train:
    max_epochs: [10]
    run_validation: [true]
    compute_validation_loss: [false]
    val_frequency: [1]
    save_checkpoints: [true]
    save_final_checkpoint_only: [true]
    checkpoint_min_delta: [0.001]
    compile: [false]
    initial_lr: [0.00002]
    box_guidance_lr: [0.0001]
    optimizer: [AdamW]
    watch_metric: [map_50]
    greater_is_better: [true]
    box_guided_alignment:
      enabled: [true]
      weight: [0.2]
      start_epoch: [0]
      warmup_epochs: [2]
      smooth_l1_beta_cells: [0.25]

  loss:

  model:
    name: [fusion_rtdetr]
    params:
      id2label:
        0: [person]
      threshold: [0.01]
      use_fam: [true]
      fam_variant: [box_guided_common_offset_p3]
      freeze_fam: [false]
      ir_dropout_rate: [0.0]
      spatial_jitter_std: [0.0]
      reuse_pretrained_class_head: [true]

  dataset:
    name: [wisard]
    root: [dataset/WiSARD]
    preprocessor:
      path: ["PekingU/rtdetr_r50vd"]
    folders: [vis_ir]
    train_folders:
      - - [210924_FHL_Enterprise_VIS_0405, 210924_FHL_Enterprise_IR_0406]
        - [220109_Baker_Enterprise_VIS_1, 220109_Baker_Enterprise_IR_1]
    val_folders:
      - - [210924_FHL_Enterprise_VIS_0401, 210924_FHL_Enterprise_IR_0402]
    single_class: [true]
    modal_dropout: [true]
    modal_dropout_probs: [[0.2, 0.2, 0.6]]
    box_alignment_targets: [true]
    box_alignment_max_distance: [0.05]
    use_tiling: [false]

  dataloader:
    num_workers: [8]
    batch_size: [4]
    evaluation_batch_size: [12]

  val_evaluation:
    metrics:

other_grids: []
