# Template for one RT-DETR final-protocol campaign at a time.
# Before launching, set experiment.name/group/tags and the model parameters
# according to exactly one of the six completed configurations:
#
# Additive:       use_fam=false, fam_variant=current_dcnv2, ir=0.0, ssj=0.0
# FAM:            use_fam=true,  fam_variant=current_dcnv2, ir=0.0, ssj=0.0
# FAM+IR dropout: use_fam=true,  fam_variant=current_dcnv2, ir=0.4, ssj=0.0
# FAM+SSJ:        use_fam=true,  fam_variant=current_dcnv2, ir=0.0, ssj=0.5
# Identity DCNv2: use_fam=true,  fam_variant=identity_dcnv2,  ir=0.0, ssj=0.0
# Grid Sample:    use_fam=true,  fam_variant=grid_sample,     ir=0.0, ssj=0.0
#
# The checked-in defaults below reproduce the Additive baseline. Use a new
# W&B project name for a new campaign unless mixing it with the completed runs
# is deliberate.

experiment:
  name: RTDETR_Protocol_Rerun
  group: RTDETR_main
  continue_with_errors: true
  start_from_grid: 0
  start_from_run: 0
  search: grid
  isolate_runs: true

parameters:
  seed: [40, 41, 42, 43, 44]
  repetition: [0]
  task: [detection]
  run_test: [true]
  test_checkpoint: [latest]

  reproducibility:
    deterministic: [false]
    warn_only: [false]
    trace: [true]
    trace_batches: [20]
    trace_tensor_batches: [5]
    trace_model_steps: [3]

  tracker:
    ignored_files: ["*.bin,*.safetensors"]
    val_image_log_frequency: [50]
    tags: [[RTDETR, Protocol, Base, Additive, Rerun]]

  train:
    max_epochs: [10]
    run_validation: [false]
    save_checkpoints: [true]
    save_final_checkpoint_only: [true]
    compile: [false]
    initial_lr: [0.00002]
    optimizer: [AdamW]
    watch_metric: [map]

  loss:

  model:
    name: [fusion_rtdetr]
    params:
      id2label:
        0: [person]
      threshold: [0.01]
      use_fam: [false]
      fam_variant: [current_dcnv2]
      freeze_fam: [false]
      ir_dropout_rate: [0.0]
      spatial_jitter_std: [0.0]
      reuse_pretrained_class_head: [true]

  dataset:
    name: [wisard]
    root: [dataset/WiSARD]
    preprocessor:
      path: ["PekingU/rtdetr_r50vd"]
    folders: [vis_ir]
    single_class: [true]
    modal_dropout: [true]
    modal_dropout_probs: [[0.2, 0.2, 0.6]]
    use_tiling: [false]

  dataloader:
    num_workers: [8]
    batch_size: [4]

  val_evaluation:
    metrics:

other_grids: []
