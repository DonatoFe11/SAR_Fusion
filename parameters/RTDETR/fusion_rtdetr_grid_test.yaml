experiment:
  name: RTDETR_FAM_Evaluation
  group: RTDETR_Evaluation
  continue_with_errors: False
  search: grid

parameters:
  seed: &seed [42]
  task: [detection]
  run_test: [true]
  test_checkpoint: [current]
  strict_checkpoint_loading: [true]

  tracker:
    ignored_files: ["*.bin,*.safetensors"]
    val_image_log_frequency: [50] 
    tags: [[FinalReport]]

  model:
    name: [fusion_rtdetr]
    params:
      id2label:
        0: [person]
      threshold: [0.01]
      use_fam: [true]
      fam_variant: [current_dcnv2]
      require_full_pretrained_match: [true]
      freeze_fam: [false]
      ir_dropout_rate: [0.0]
      spatial_jitter_std: [0.0] # Messo a 0 durante la valutazione
      pretrained_path: ["checkpoints/model.safetensors"]

  dataset:
    name: [wisard]
    root: [dataset/WiSARD]
    preprocessor:
      path: ["PekingU/rtdetr_r50vd"]
    folders: [vis, ir, vis_ir] 
    single_class: [true]
    use_tiling: [false]  

  dataloader:
    num_workers: [8]
    batch_size: [12]

  val_evaluation:
    metrics:

other_grids: []