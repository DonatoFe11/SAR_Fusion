experiment:
  name: RTDETR_FAM_Eager_Dropout_0_4_Eval
  group: RTDETR_Investigation
  continue_with_errors: False
  search: grid

parameters:
  seed: &seed [42]
  task: [detection]

  tracker:
    ignored_files: ["*.bin,*.safetensors"]
    val_image_log_frequency: [50] 
    tags: [[FinalReport]]

  model:
    name: [fusion_rtdetr]
    params:
      id2label:
        0: [person]
      threshold: [0.01, 0.05, 0.1]
      use_fam: [true]
      freeze_fam: [false]
      ir_dropout_rate: [0.4]
      pretrained_path: ["checkpoints/model.safetensors"]

  dataset:
    name: [wisard]
    root: [dataset/WiSARD]
    preprocessor:
      path: ["PekingU/rtdetr_r50vd"]
    folders: [vis, ir, vis_ir] 
    single_class: [true]
    use_tiling: [false]  

  dataloader:
    num_workers: [8]
    batch_size: [12]

  val_evaluation:
    metrics:

other_grids: []